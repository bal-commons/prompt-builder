<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Preview</title>
  <style>
    :root {
      --bg: #f5f6f8; --panel: #fff; --fg: #1d2330; --muted: #6b7280; --line: #e3e6eb; --accent: #2563eb; --accent-soft: #e8efff;
      --warn: #b45309; --ok: #047857; --err: #b91c1c; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0f1218; --panel: #171b23; --fg: #e6e8ec; --muted: #9aa3b2; --line: #2a303b;
        --accent: #6ea0ff; --accent-soft: #1d2940; --warn: #f5a524; --ok: #34d399; --err: #f87171; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0f1218; --panel: #171b23; --fg: #e6e8ec; --muted: #9aa3b2; --line: #2a303b;
      --accent: #6ea0ff; --accent-soft: #1d2940; --warn: #f5a524; --ok: #34d399; --err: #f87171; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
    button, select, input { font: inherit; color: inherit; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    #app { height: 100%; }
    .shell { display: grid; grid-template-columns: 200px 1fr; height: 100%; }
    .shell.top, .shell.hub { grid-template-columns: 1fr; }
    .shell.rail-collapsed { grid-template-columns: 56px 1fr; }
    .side { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
    .brand { font-weight: 700; padding: 4px 10px 12px; }
    .nav-item { text-align: left; border: none; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
    .nav-item:hover { background: var(--bg); }
    .nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .collapse-rail { margin-top: auto; color: var(--muted); font-size: 12px; }
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    header.top { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header.top h1 { font-size: 16px; margin: 0; }
    header.top .links { display: flex; gap: 2px; }
    .header-end { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .who { font-size: 12px; color: var(--muted); }
    .who select { font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
    main { flex: 1; overflow: auto; padding: 14px; }
    .cols { display: grid; gap: 12px; align-items: start; }
    .col { display: grid; gap: 12px; min-width: 0; position: relative; }
    .col.collapsed { min-height: 40px; }
    .collapse { position: absolute; top: -6px; right: -6px; z-index: 1; }
    .icon { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
    .card.empty { color: var(--muted); text-align: center; padding: 28px 12px; }
    .card.custom { border-style: dashed; border-color: var(--warn); }
    .tag { font-size: 11px; color: var(--warn); }
    .chat { display: block; height: 520px; }
    .muted { color: var(--muted); font-size: 12px; }
    .error { color: var(--err); font-size: 13px; }
    .runs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .box-head { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
    .count { font-size: 12px; color: var(--muted); font-weight: 400; }
    .run { display: grid; gap: 2px; text-align: left; border: 1px solid transparent; background: none; padding: 7px 9px; border-radius: 6px; cursor: pointer; }
    .run:hover { background: var(--bg); }
    .run.on { border-color: var(--accent); background: var(--accent-soft); }
    .run-top { display: flex; gap: 6px; align-items: center; }
    .run-top strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .pill { font-size: 11px; padding: 0 7px; border-radius: 8px; background: var(--bg); }
    .pill.DONE { color: var(--ok); } .pill.FAILED { color: var(--err); } .pill.WAITING { color: var(--warn); }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); background: var(--panel); border-left: 1px solid var(--line);
      box-shadow: -8px 0 24px rgb(0 0 0 / .15); padding: 12px; overflow: auto; z-index: 5; display: grid; gap: 10px; align-content: start; }
    .drawer[hidden] { display: none; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; }
    .pane { display: block; }
    commons-hub { height: 100%; }
    @media (max-width: 720px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .side { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 6px; }
      .side .brand { padding: 6px; }
      .collapse-rail { display: none; }
      .cols { grid-template-columns: 1fr !important; }
      .collapse { display: none; }
      header.top { flex-wrap: wrap; }
    }
  </style>
  <script type="module" src="js/preview/runtime.js"></script>
</head>
<body>
  <div id="app"><p style="padding:16px" class="muted">Loading the preview…</p></div>
</body>
</html>
